name: Build Geode Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            os: windows-latest
          - platform: android32
            os: ubuntu-latest
          - platform: android64
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # DIESER SCHRITT LÄDT DAS GEODE SDK & SETZT GEODE_SDK FÜR CMAKE
      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          platform: ${{ matrix.platform }}
